<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【 E T T E 】</title>
    <link rel="stylesheet" th:href="@{/css/default.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>
    <!-- ヘッダー -->
    <div th:if="${session.loginId}" th:replace="fragments/header :: header"></div>

    <!-- メイン -->
    <main>
        <!-- バーナー -->
        <div class="main-index-banner">
            <a th:href="${session.loginId} ? @{/productList} : @{/login}">
                <img th:src="@{/images/photo/main-banner.png}" alt="バーナー" class="img-index-banner" />
            </a>
        </div>
    </main>

    <!-- フッター -->
    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
