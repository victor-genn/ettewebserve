<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【 商品修正 - E T T E 】</title>
    <link rel="stylesheet" th:href="@{/css/default.css}" />
    <link rel="stylesheet" th:href="@{/css/product.css}" />
</head>

<body>

    <div th:replace="fragments/headerLogined :: header"></div>

    <main>

        <div class="page-path" style="margin-bottom: 20px;">
            <a th:href="@{/index}">メイン＞</a>
            <a th:href="@{/productList}">商品一覧＞</a>
            <a th:href="@{/productUpdate}">商品修正</a>
        </div>

        <div class="probDetail-content">
            <form th:action="@{/productUpdate}" method="post" th:object="${productUpdateForm}"
                enctype="multipart/form-data" class="product-imgRegister">
                <input type="hidden" th:field="*{productId}" />

                <div style="margin: 20px 0;">
                    <img id="previewImage" th:src="|${productUpdateForm.imagePath}|" alt="商品画像"
                        class="img-default-banner" style="width: 100%;" />
                    <input type="file" id="imageInput" name="productImage" class="probDetail-file" />
                </div>

                <div class="div-default-form">

                    <img th:src="@{/images/icon/updateproduct.png}" alt="サブタイトル" class="img-default-subtitle" />

                    <div class="prodDetail-form">
                        <div class="probDetail-grid2 prodUpdate-partion">

                            <div class="probDetail-grid2">
                                <label class="prodDetail-label" style="margin-right: 4px;">カテゴリー</label>
                                <input type="hidden" th:field="*{categoryId}" />
                                <span th:each="c : ${categoryList}"
                                    th:if="${c.categoryId} == ${productUpdateForm.categoryId}"
                                    th:text="${c.categoryName}" class="prodDetail-select" style="color: gray;">
                                </span>
                            </div>

                            <div class="probUpdate-grid2">
                                <label class="prodDetail-label">商品名</label>
                                <input type="hidden" th:field="*{productName}" />
                                <span th:text="*{productName}" class="prodUpdate-input1" style="color: gray;"></span>
                            </div>
                        </div>

                        <div class="prodUpdate-grid4 probDetail-partion">

                            <label class="prodDetail-label">キーワード</label>
                            <select th:field="*{keywordId}" class="prodDetail-select">
                                <option value="">--キーワード--</option>
                                <option th:each="k : ${keywordList}" th:value="${k.keywordId}"
                                    th:text="${k.keywordName}">キーワード</option>
                            </select>
                        </div>

                        <div class="probDetail-grid2 probDetail-partion">

                            <div class="probDetail-grid2">
                                <label class="prodDetail-label">製造国</label>
                                <select th:field="*{countryId}" class="prodDetail-select">
                                    <option value="">--製造国--</option>
                                    <option th:each="country : ${countryList}" th:value="${country.countryId}"
                                        th:text="${country.countryName}">製造国</option>
                                </select>
                            </div>

                            <div class="probDetail-grid2">
                                <label class="prodDetail-label">製造年月</label>
                                <input type="date" th:field="*{manufactureDate}" class="probUpdate-date" />
                            </div>
                        </div>

                        <div class="probDetail-partion">

                            <input type="text" th:field="*{description}" class="probDetail-span2" placeholder="商品説明" />
                        </div>

                        <div class="prodUpdate-grid5 probDetail-partion">

                            <label class="prodDetail-label">数量</label>
                            <input type="number" th:field="*{stockS}" min="0" placeholder="S"
                                class="prodUpdate-numbers" />
                            <input type="number" th:field="*{stockM}" min="0" placeholder="M"
                                class="prodUpdate-numbers" />
                            <input type="number" th:field="*{stockL}" min="0" placeholder="L"
                                class="prodUpdate-numbers" />
                            <!-- error -->
                            <input type="number" th:field="*{stockXL}" min="0" placeholder="XL"
                                class="prodUpdate-numbers" />
                        </div>

                        <div class="prodUpdate-grid31 probDetail-partion">

                            <div class="prodUpdate-grid22">
                                <label class="prodDetail-label">定価</label>
                                <input type="number" th:field="*{regularPrice}" class="prodUpdate-price"
                                    placeholder="価格" style="color: black;" />
                            </div>

                            <div class="prodUpdate-percentdiv">
                                <label class="prodDetail-label">割引</label>
                                <input type="number" th:field="*{discountRate}" class="prodUpdate-percent"
                                    placeholder="%" />
                                <span>%</span>
                            </div>

                            <div class="prodUpdate-grid21">
                                <label class="prodDetail-label">販売価格</label>
                                <input type="number" th:field="*{salePrice}" class="prodUpdate-price"
                                    placeholder="割引した価格" disabled />
                            </div>
                        </div>
                        <div class="probDetail-buttondiv" style="margin-top: 30px;">

                            <button type="submit" class="probDetail-button">更新</button>
                            <a th:href="@{session.userId != null} ? '/productList' : '/index'"
                                class="probDetail-button">戻る</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        function updateSalePrice() {
            const regularPrice = parseFloat(document.querySelector('[name="regularPrice"]').value) || 0;
            const discountRate = parseFloat(document.querySelector('[name="discountRate"]').value) || 0;
            const salePrice = Math.floor(regularPrice * (1 - discountRate / 100));
            document.querySelector('[name="salePrice"]').value = salePrice;
        }

        document.querySelector('[name="regularPrice"]').addEventListener('input', updateSalePrice);
        document.querySelector('[name="discountRate"]').addEventListener('input', updateSalePrice);

        const imageInput = document.getElementById("imageInput");
        const previewImage = document.getElementById("previewImage");

        imageInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    });
</script>
